<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay Tuned</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
    }

    .splash-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: pointer;
    }

    .message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      padding: 18px 32px;

      color: #fff;
      background: rgba(0, 0, 0, 0.78);
      border: 2px solid #fff;
      border-radius: 8px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(24px, 5vw, 64px);
      font-weight: bold;
      letter-spacing: 3px;
      line-height: 1;
      text-align: center;
      white-space: nowrap;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .message.show {
      visibility: visible;
      animation: showMessage 3s ease-in-out forwards;
    }

    @keyframes showMessage {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.9);
      }

      15% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      80% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @media (max-width: 400px) {
      .message {
        padding: 14px 20px;
        letter-spacing: 1px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <img
      id="splashImage"
      class="splash-image"
      src="splash.jpg"
      alt="Splash image"
      tabindex="0"
    >

    <div id="message" class="message">
      STAY TUNED!
    </div>
  </main>

  <script>
    const splashImage = document.getElementById("splashImage");
    const message = document.getElementById("message");

    let messageTimer;

    function showMessage() {
      // Clear any existing timer.
      clearTimeout(messageTimer);

      // Restart the animation if the message is already visible.
      message.classList.remove("show");

      // Force the browser to restart the animation.
      void message.offsetWidth;

      message.classList.add("show");

      // Remove the class after three seconds.
      messageTimer = setTimeout(function () {
        message.classList.remove("show");
      }, 3000);
    }

    // Show the message when the image is clicked or tapped.
    splashImage.addEventListener("click", showMessage);

    // Also allow keyboard activation for accessibility.
    splashImage.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        showMessage();
      }
    });
  </script>
</body>
</html>
