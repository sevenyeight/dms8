<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay Tuned</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
    }

    .splash-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      padding: 18px 32px;

      color: #fff;
      background: rgba(0, 0, 0, 0.78);
      border: 2px solid #fff;
      border-radius: 8px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(24px, 5vw, 64px);
      font-weight: bold;
      letter-spacing: 3px;
      line-height: 1;
      text-align: center;
      white-space: nowrap;

      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.9);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @media (max-width: 400px) {
      .message {
        padding: 14px 20px;
        letter-spacing: 1px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <img
      class="splash-image"
      src="splash.jpg"
      alt="Splash image"
    >

    <div class="message">STAY TUNED!</div>
  </main>
</body>
</html>
