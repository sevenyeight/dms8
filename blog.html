<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Dimension 78</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000000; /* Pure black background */
            color: #ffffff;
            line-height: 1.6;
        }
        /* Top Banner Style */
        .site-banner {
            background-color: #111111;
            color: #fff;
            text-align: center;
            padding: 2.5rem 1rem 1.5rem 1rem;
        }
        /* Banner Image Style */
        .banner-image-container {
            text-align: center;
            padding-top: 1.5rem;
            background-color: #111111;
        }
        .banner-image {
            width: 100%;
            max-width: auto; /* Adjust size as needed */
            height: 270px
            border-radius: 2px;
            display: block;
            margin: 0 auto;
        }
        .site-banner h1 {
            margin: 0.5rem 0 0 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }
        /* Navigation Links */
        nav {
            text-align: center;
            background-color: #111111;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }
        nav a {
            text-decoration: none;
            color: #aaa;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        nav a:hover {
            color: #fff;
        }
        /* Main Container */
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 20px 40px 20px;
        }
        /* Post Card Style (Kept unchanged as requested) */
        .post-card {
            background: #fff;
            color: #222;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }
        .post-card:hover {
            transform: translateY(-2px);
        }
        .post-card h2 {
            margin-top: 0;
            font-size: 1.5rem;
        }
        .post-card h2 a {
            color: #111;
            text-decoration: none;
        }
        .post-card h2 a:hover {
            color: #0066cc;
        }
        .post-date {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

    <!-- Top Banner Image (Replace URL with your actual uploaded image path in assets/images/) -->
    <div class="banner-image-container">
        <img src="/assets/images/blog_images/Banner-78.jpg" alt="Dimension 78" class="banner-image">
    </div>

    <!-- Top Banner Header -->
    <div class="site-banner">
        <h1>DIMENSION 78 JOURNAL</h1>
    </div>

    <!-- Navigation (Only Blog Home) -->
    <nav>
        <a href="/blog">Blog Home</a>
    </nav>

    <!-- Post List Container -->
    <div class="container">
        {% for post in site.posts %}
          <div class="post-card">
            <div class="post-date">{{ post.date | date: "%B %d, %Y" }}</div>
            <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
            <p>{{ post.excerpt }}</p>
          </div>
        {% endfor %}
    </div>

</body>
</html>
