<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Dimension 78</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            line-height: 1.6;
        }
        /* Top Banner Image */
        .banner-image-container {
            text-align: center;
            padding-top: 1.5rem;
            background-color: #111111;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .banner-image {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 6px;
            display: block;
            margin: 0 auto;
        }
        /* Top Banner Header */
        .site-banner {
            background-color: #111111;
            color: #fff;
            text-align: center;
            padding: 2.5rem 1rem 1.5rem 1rem;
        }
        .site-banner h1 {
            margin: 0.5rem 0 0 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }
        /* Navigation Links */
        nav {
            text-align: center;
            background-color: #111111;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }
        nav a {
            text-decoration: none;
            color: #aaa;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        nav a:hover {
            color: #fff;
        }
        /* Main Container */
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 20px 40px 20px;
        }
        /* Post Card Style with Thumbnail Layout */
        .post-card {
            background: #fff;
            color: #222;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: flex;
            gap: 1.5rem;
            align-items: center;
            transition: transform 0.2s ease;
        }
        .post-card:hover {
            transform: translateY(-2px);
        }
        /* Thumbnail Image Styling */
        .post-thumb {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .post-content {
            flex-grow: 1;
        }
        .post-content h2 {
            margin-top: 0;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }
        .post-content h2 a {
            color: #111;
            text-decoration: none;
        }
        .post-content h2 a:hover {
            color: #0066cc;
        }
        .post-date {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }
        .post-excerpt {
            margin: 0;
            font-size: 0.95rem;
            color: #444;
        }
    </style>
</head>
<body>

    <!-- Top Banner Image -->
    <div class="banner-image-container">
        <img src="/assets/images/blog_images/blogbanner.jpg" alt="Dimension 78" class="banner-image">
    </div>

    <!-- Top Banner Header -->
    <div class="site-banner">
        <h1>DIMENSION 78 JOURNAL</h1>
    </div>

    <!-- Navigation -->
    <nav>
        <a href="/blog">Blog Home</a>
    </nav>

    <!-- Post List Container -->
    <div class="container">
        {% for post in site.posts %}
          <div class="post-card">
            
            <!-- If the post has an image defined in its top settings, show it -->
            {% if post.image %}
              <img src="{{ post.image }}" alt="{{ post.title }}" class="post-thumb">
            {% endif %}

            <div class="post-content">
              <div class="post-date">{{ post.date | date: "%B %d, %Y" }}</div>
              <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
              <p class="post-excerpt">{{ post.excerpt | strip_html | truncatewords: 25 }}</p>
            </div>

          </div>
        {% endfor %}
    </div>

</body>
</html>
