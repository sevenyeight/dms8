<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Dimension 78</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            line-height: 1.6;
        }
        /* Top Banner Header */
        .site-banner {
            background-color: #111111;
            color: #fff;
            text-align: center;
            padding: 2.5rem 1rem 1.5rem 1rem;
        }
        .site-banner h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }
        /* Navigation / Back to Blog */
        .nav-container {
            text-align: center;
            background-color: #111111;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }
        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #aaa;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border: 1px solid #333;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            color: #fff;
            border-color: #777;
            background-color: #222;
        }
        /* Main Post Container */
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 20px 60px 20px;
            background: #fff;
            color: #222;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .post-header {
            padding-top: 2rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
        }
        .post-header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            color: #111;
        }
        .post-date {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Post Content Styling */
        .post-body img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
            margin: 1.5rem auto;
        }
        /* Bottom Navigation Area */
        .bottom-nav {
            text-align: center;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

    <!-- Top Banner Header -->
    <div class="site-banner">
        <h1>DIMENSION 78 JOURNAL</h1>
    </div>

    <!-- Back to Blog Button (Top) -->
    <div class="nav-container">
        <a href="/blog" class="back-btn">&larr; Back to Blog</a>
    </div>

    <!-- Main Post Content Card -->
    <div class="container">
        <div class="post-header">
            <div class="post-date">{{ page.date | date: "%B %d, %Y" }}</div>
            <h1>{{ page.title }}</h1>
        </div>

        <div class="post-body">
            {{ content }}
        </div>

        <!-- Back to Blog Button (Bottom) -->
        <div class="bottom-nav">
            <a href="/blog/" class="back-btn">&larr; Back to Blog</a>
        </div>
    </div>

</body>
</html>
